[project]
name = "giano"
version = "0.1.0"
description = "Gerenciador TUI de melhorias de sistemas, com lista versionada por revisões."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "textual[syntax]>=1.0",
    "markdown-it-py>=3.0",
    "jinja2>=3.1",
    "pygments>=2.18",
    "typer>=0.12",
    "platformdirs>=4.2",
]

[project.scripts]
giano = "giano.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/giano"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
