[package]
name = "giano-core"
description = "Giano: domain, database (SQLite / Turso) and services. No UI."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
# Local SQLite file. "bundled" compiles SQLite with FTS5, which the schema needs.
rusqlite = { version = "0.32", features = ["bundled"] }
# Turso: Hrana-over-HTTP, a small synchronous client (src/db/remote.rs).
ureq = { version = "2.10", default-features = false, features = ["tls", "json"] }
base64 = "0.22"
regex = "1"
unicode-normalization = "0.1"
dirs = "5"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
# Pure-Rust regex engine (no Oniguruma C build).
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
minijinja = "2"

[dev-dependencies]
tempfile = "3"
